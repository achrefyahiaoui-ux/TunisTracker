<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة مخطط السنة الثالثة</title>
<meta name="description" content="متابعة إنجاز حصص الرياضيات والإيقاظ العلمي للسنة الثالثة ابتدائي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#faf8f3; --ink:#1d2320; --ink-2:#4b5550; --ink-3:#7a837e;
  --line:#e2ded4; --line-2:#ece8df;
  --ok:#1f8a4c; --ok-bg:#e4f4ea; --ok-bg-2:#d3eddc; --ok-line:#9fd3b3;
  --sup:#b8620b; --sup-bg:#fdf0dc; --sup-line:#f0c68a;
  --todo:#d9d5cb;
  --head:#dfe9c9; --head-ink:#33421d; --act:#e9c795; --act-ink:#5c3d12;
  --shadow:0 1px 2px rgba(30,35,30,.06),0 2px 8px rgba(30,35,30,.05);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --surface:#1c211f; --surface-2:#202624; --ink:#e9ede9; --ink-2:#b6bfba; --ink-3:#86908a;
    --line:#2f3733; --line-2:#29302d;
    --ok:#4cc27d; --ok-bg:#183425; --ok-bg-2:#1d3f2c; --ok-line:#2f6b47;
    --sup:#f0a24a; --sup-bg:#3a2a14; --sup-line:#6b4a1f;
    --todo:#39413d; --head:#2c3a22; --head-ink:#d6e6bd; --act:#4a3a22; --act-ink:#f0d6ad;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1c211f; --surface-2:#202624; --ink:#e9ede9; --ink-2:#b6bfba; --ink-3:#86908a;
  --line:#2f3733; --line-2:#29302d;
  --ok:#4cc27d; --ok-bg:#183425; --ok-bg-2:#1d3f2c; --ok-line:#2f6b47;
  --sup:#f0a24a; --sup-bg:#3a2a14; --sup-line:#6b4a1f;
  --todo:#39413d; --head:#2c3a22; --head-ink:#d6e6bd; --act:#4a3a22; --act-ink:#f0d6ad;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.7}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header.top{padding:28px 0 8px}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:0}
.sub{color:var(--ink-3);margin:2px 0 0;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn svg{width:16px;height:16px}

.summary{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px;margin:20px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.stat .k{font-size:13px;color:var(--ink-3)}
.stat .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat.ok .v{color:var(--ok)} .stat.sup .v{color:var(--sup)}
.big .v{font-size:34px}
.bar{height:10px;border-radius:99px;background:var(--todo);overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%;transition:width .35s ease}
.bar .b-ok{background:var(--ok)} .bar .b-sup{background:var(--sup)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:middle;background:var(--todo)}
.legend .l-ok::before{background:var(--ok)} .legend .l-sup::before{background:var(--sup)}

/* ---------- sticky nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;margin-top:14px}
.nav .wrap{display:flex;flex-direction:column;gap:10px}
.nav-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.tab{border:0;background:none;padding:7px 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .pct{font-weight:500;opacity:.7;margin-inline-start:6px;font-size:12px}
.filters{display:inline-flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink-3);margin-inline-start:4px}
.periods{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.pjump{flex:1 0 128px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px 8px;color:var(--ink);border-top:3px solid var(--pc)}
.pjump b{font-size:13px;font-weight:600}
.pjump small{float:left;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.pjump .bar{height:6px;margin-top:5px}
.pjump.done{background:var(--ok-bg)}

/* ---------- period section ---------- */
main{padding:18px 0 60px}
.period{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden;border-top:5px solid var(--pc)}
.p-head{display:flex;align-items:center;gap:16px;padding:14px 18px;cursor:pointer;user-select:none;flex-wrap:wrap}
.p-head h2{margin:0;font-size:19px;font-weight:700}
.p-head h2 small{font-weight:500;color:var(--ink-3);font-size:14px;margin-inline-start:6px}
.p-prog{flex:1;min-width:200px;max-width:460px;margin-inline-start:auto}
.p-prog .bar{margin-top:0}
.p-count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
.p-count .c-ok{color:var(--ok);font-weight:600} .p-count .c-sup{color:var(--sup);font-weight:600}
.badge-done{background:var(--ok);color:#fff;border-radius:99px;font-size:12px;padding:2px 10px;font-weight:600}
.chev{width:22px;height:22px;color:var(--ink-3);transition:transform .2s}
.period.collapsed .chev{transform:rotate(90deg)}
.period.collapsed .p-body{display:none}
.p-body{padding:0 18px 18px}
.sec-label{font-size:14px;font-weight:600;color:#4a74a8;margin:6px 2px 8px;display:flex;align-items:center;gap:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec-label{color:#8fb4e0}}
:root[data-theme="dark"] .sec-label{color:#8fb4e0}

/* ---------- table ---------- */
.tbl-wrap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--head);color:var(--head-ink);font-weight:600;font-size:14px;padding:9px 10px;border-inline-start:1px solid var(--line);text-align:center;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);border-inline-start:1px solid var(--line-2);vertical-align:top;white-space:pre-line}
th:first-child,td:first-child{border-inline-start:0}
td.act{background:var(--act);color:var(--act-ink);font-weight:600;text-align:center;vertical-align:middle;width:74px}
td.comp{background:var(--surface-2);color:var(--ink-2);vertical-align:middle;width:170px;font-size:13.5px}
td.day{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;width:54px;vertical-align:middle;font-size:15px}
td.goal{min-width:170px}
td.cont{min-width:170px}
td.sess{min-width:190px}
td.st{width:196px;vertical-align:middle;background:var(--surface)}
.note{display:block;color:var(--ink-3);font-size:12.5px}
tr.s-row{transition:background .25s}
tr.s-row.is-ok td:not(.act):not(.merged),tr.s-row.is-sup td:not(.act):not(.merged){background:var(--ok-bg)}
tr.s-row.is-ok td.day{box-shadow:inset -4px 0 0 var(--ok)}
tr.s-row.is-sup td.day{box-shadow:inset -4px 0 0 var(--sup)}
.stbtns{display:flex;flex-direction:column;gap:6px}
.sbtn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:500;text-align:start;width:100%}
.sbtn .box{width:18px;height:18px;border-radius:5px;border:1.6px solid var(--ink-3);display:grid;place-items:center;flex:none;background:var(--surface)}
.sbtn .box svg{width:13px;height:13px;opacity:0}
.sbtn:hover{border-color:var(--ink-3)}
.sbtn.ok[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.sbtn.ok[aria-pressed="true"] .box{border-color:#fff;background:#fff;color:var(--ok)}
.sbtn.sup[aria-pressed="true"]{background:var(--sup);border-color:var(--sup);color:#fff}
.sbtn.sup[aria-pressed="true"] .box{border-color:#fff;background:#fff;color:var(--sup)}
.sbtn[aria-pressed="true"] .box svg{opacity:1}
.stamp{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:2px;font-variant-numeric:tabular-nums}
.empty{padding:18px;text-align:center;color:var(--ink-3);font-size:14px}

/* ---------- evaluation ---------- */
.eval{margin-top:18px}
.eval td.perf{white-space:pre-line;line-height:1.9}
.eval td.att{width:280px;vertical-align:middle;background:var(--surface)}
.eval tr.has-file td.perf{background:var(--ok-bg)}
.attach-btn{width:100%;justify-content:center;border:1.5px dashed var(--ink-3);background:var(--surface-2);color:var(--ink);font-weight:600;padding:10px 12px;border-radius:10px;display:flex;gap:8px;align-items:center;font-size:14px}
.attach-btn:hover{border-color:var(--ok);color:var(--ok)}
.attach-btn svg{width:18px;height:18px}
.files{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:8px;border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:9px;padding:5px 8px;font-size:12.5px}
.files a{color:var(--ink);text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.files a:hover{text-decoration:underline}
.files .x{border:0;background:none;color:var(--ink-3);padding:2px;display:grid;place-items:center}
.files .x:hover{color:#c0392b}
.files .x svg{width:15px;height:15px}
.files .sz{color:var(--ink-3);font-variant-numeric:tabular-nums}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{color:var(--ink-3);font-size:12.5px;text-align:center;padding:10px 0 30px}

/* ---------- responsive: cards ---------- */
@media (max-width:900px){
  .summary{grid-template-columns:repeat(3,1fr);gap:8px}
  .summary .stat:not(.big){padding:10px 12px}
  .summary .stat:not(.big) .v{font-size:22px}
  .summary .stat:not(.big) .k:last-child{display:none}
  .summary .big{grid-column:1/-1}
  h1{font-size:21px}
  .filters{margin-inline-start:0}
  .nav{position:static}
  html{scroll-padding-top:10px}
  .wrap{padding:0 16px}
  .p-body{padding:0 10px 12px}
  .tbl-wrap{border:0;overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr.s-row{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
  tr.s-row.is-ok,tr.s-row.is-sup{border-color:var(--ok-line)}
  td{border:0;border-top:1px solid var(--line-2);padding:8px 12px;width:auto !important;min-width:0 !important}
  td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:1px}
  td.act{display:none}
  td.day{order:-1;border-top:0;text-align:start;background:var(--head)!important;color:var(--head-ink);box-shadow:none!important;padding:7px 12px}
  td.day::before{display:inline!important;margin-inline-end:6px;color:inherit!important;opacity:.75}
  td.comp{background:var(--surface-2)}
  tr.s-row.is-ok td.day{background:var(--ok)!important;color:#fff}
  tr.s-row.is-sup td.day{background:var(--ok)!important;color:#fff}
  .stbtns{flex-direction:row}
  .eval tr{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
  .eval td.att{width:auto}
}
@media print{
  .nav,.tools,.stbtns .sbtn:not([aria-pressed="true"]),.attach-btn,.files .x{display:none!important}
  .period.collapsed .p-body{display:block}
  body{background:#fff}
  .period{break-inside:auto;box-shadow:none}
}
</style>
<style>
/* ---------- v2: years + multi-activity ---------- */
.years{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
.year{flex:1 1 220px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);color:var(--ink);display:flex;align-items:center;gap:14px}
.year .yt{font-size:17px;font-weight:700}
.year .ys{font-size:12.5px;color:var(--ink-3)}
.year .ring{--p:0;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--todo) 0);position:relative}
.year .ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.year .ring span{position:relative}
.year[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink),var(--shadow)}
.year[aria-pressed="true"] .yt::after{content:" ●";color:var(--ok);font-size:11px;vertical-align:middle}
td.act.a0{background:var(--act)}
.subj-arabic td.act.a0{background:#e98b84;color:#4d1512}
.subj-arabic td.act.a1{background:#7fb3dc;color:#10304d}
.subj-arabic td.act.a2{background:#e9b56a;color:#4d310b}
.subj-arabic td.act.a3{background:#b6a0d9;color:#2c1850}
.subj-science td.act{background:#9cc3e3;color:#12324f}
td.dg{background:var(--surface-2);color:var(--ink-2);vertical-align:middle;min-width:170px}
.actchip{display:none}
.cell-lab{color:#c0392b;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .subj-arabic td.act,:root:not([data-theme="light"]) .subj-science td.act{filter:brightness(.62) saturate(1.1);color:#fff}}
:root[data-theme="dark"] .subj-arabic td.act,:root[data-theme="dark"] .subj-science td.act{filter:brightness(.62) saturate(1.1);color:#fff}
@media (max-width:900px){
  .years{gap:8px}
  .year{padding:10px 12px}
  .actchip{display:inline-block;margin-inline-start:8px;font-size:12px;font-weight:600;background:rgba(0,0,0,.08);padding:0 8px;border-radius:99px}
  td.dg{background:var(--surface-2)}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title-row">
      <div>
        <h1>متابعة إنجاز المخططات السنوية</h1>
        <p class="sub" id="subtitle">التعلّم المنهجي والتقييم</p>
      </div>
      <div class="tools">
        <button class="btn" id="exportBtn" title="حفظ نسخة احتياطية من التقدم والمرفقات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>نسخة احتياطية</button>
        <button class="btn" id="importBtn" title="استرجاع نسخة احتياطية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 7V5a2 2 0 012-2h12a2 2 0 012 2v2"/></svg>استرجاع</button>
        <button class="btn" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v7H6z"/></svg>طباعة</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
    <div class="years" id="years"></div>
    <div class="summary" id="summary"></div>
  </div>
</header>

<nav class="nav" aria-label="التنقل">
  <div class="wrap">
    <div class="nav-row">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="periods" id="periodNav"></div>
  </div>
</nav>

<main><div class="wrap" id="content"></div></main>
<footer>يُحفظ التقدّم والمرفقات تلقائيًا على هذا الجهاز. استعمل «نسخة احتياطية» لنقلها إلى جهاز آخر.</footer>
<input type="file" id="attachInput" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" hidden>

/* ---------- storage ---------- */
const LS_KEY='tunistracker.v1';
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let state = lsGet(LS_KEY,{status:{},ui:{}});
state.status ||= {}; state.ui ||= {}; state.ui.collapsed ||= {}; state.ui.tabs ||= {};
const save=()=>lsSet(LS_KEY,state);

let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ try{
  const r=indexedDB.open('tunistracker',1);
  r.onupgradeneeded=()=>{const s=r.result.createObjectStore('files',{keyPath:'id'}); s.createIndex('evalKey','evalKey')};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
 }catch(e){rej(e)} }); return dbp; }
async function filesFor(evalKey){ try{ const d=await db(); return await new Promise((res,rej)=>{const t=d.transaction('files').objectStore('files').index('evalKey').getAll(evalKey);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)}) }catch(e){return []} }
async function allFiles(){ try{ const d=await db(); return await new Promise((res,rej)=>{const t=d.transaction('files').objectStore('files').getAll();t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)}) }catch(e){return []} }
async function putFile(rec){ const d=await db(); return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)}) }
async function delFile(id){ const d=await db(); return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)}) }

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').replace(/[ً-ْـ*.:]/g,'').replace(/\s+/g,' ').trim();
function fmtDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString('ar-TN',{day:'numeric',month:'long'}); }
function fmtSize(b){ return b<1024*1024? Math.max(1,Math.round(b/1024))+' ك.ب' : (b/1048576).toFixed(1)+' م.ب'; }
function cellHTML(t){
  return esc(t).split('\n').map(l=>{
    if(/^-?\s*(حساب ذهني|الحساب الذهني)/.test(l)) return `<span class="note">${l}</span>`;
    const m=l.match(/^(\*?\s*)(الشمول|تحليل|تركيب|الحصّة\s*\d+|الحصة\s*\d+|فيزياء)(\s*:)(.*)$/) || l.match(/^(\*?\s*)(علم أحياء)(\s*:?)(.*)$/);
    if(m) return `${m[1]}<span class="cell-lab">${m[2]}${m[3]}</span>${m[4]}`;
    return l;
  }).join('\n');
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }

const YEARS=PLAN.years;
const findYear=id=>YEARS.find(y=>y.id===id)||YEARS[0];
let year = findYear(state.ui.year||'y3').id;
const Y=()=>findYear(year);
const subjOf=(yid,sid)=>findYear(yid).subjects.find(s=>s.id===sid);
let subj = state.ui.tabs[year] && subjOf(year,state.ui.tabs[year]) ? state.ui.tabs[year] : Y().subjects[0].id;
const S=()=>subjOf(year,subj);
let filter = state.ui.filter || 'all';
const isMobile=()=>matchMedia('(max-width:900px)').matches;

function countSessions(list){ let total=0,ok=0,sup=0; for(const s of list){ total++; const st=state.status[s.key]?.s; if(st==='ok')ok++; else if(st==='sup')sup++; } return {total,ok,sup,left:total-ok-sup,pct: total? Math.round((ok+sup)/total*100):0}; }
const periodSessions=P=>P.sessions;
const subjSessions=Sb=>Sb.periods.flatMap(p=>p.sessions);
const yearSessions=Yr=>Yr.subjects.flatMap(subjSessions);
const barHTML=st=>`<div class="bar" role="img" aria-label="${st.ok} تم الاستيعاب، ${st.sup} يحتاج إلى دعم، ${st.left} متبقية"><i class="b-ok" style="width:${st.total?st.ok/st.total*100:0}%"></i><i class="b-sup" style="width:${st.total?st.sup/st.total*100:0}%"></i></div>`;

function renderYears(){
  $('#years').innerHTML = YEARS.map(Yr=>{ const st=countSessions(yearSessions(Yr));
    return `<button class="year" data-year="${Yr.id}" aria-pressed="${Yr.id===year}"><div class="ring" style="--p:${st.pct}"><span>${st.pct}٪</span></div>
      <div><div class="yt">${Yr.name}</div><div class="ys">${Yr.subjects.map(s=>s.name).join(' · ')} — ${st.total} حصة</div></div></button>`}).join('');
  $('#subtitle').textContent = `${Y().name}: ${Y().subjects.map(s=>s.name).join(' و')} — التعلّم المنهجي والتقييم`;
}
function renderSummary(){
  const Yr=Y(), A=countSessions(yearSessions(Yr)), per=Yr.subjects.map(s=>[s,countSessions(subjSessions(s))]);
  const brk=k=>per.map(([s,st])=>`${s.act} ${st[k]}`).join(' · ');
  $('#summary').innerHTML = `
   <div class="card stat big"><div class="k">التقدم في ${Yr.name} (${A.ok+A.sup} من ${A.total} حصة)</div><div class="v">${A.pct}٪</div>${barHTML(A)}
     <div class="legend"><span class="l-ok">تم الاستيعاب</span><span class="l-sup">يحتاج إلى دعم</span><span>لم تُنجز بعد</span></div></div>
   <div class="card stat ok"><div class="k">تم الاستيعاب</div><div class="v">${A.ok}</div><div class="k">${brk('ok')}</div></div>
   <div class="card stat sup"><div class="k">يحتاج إلى دعم</div><div class="v">${A.sup}</div><div class="k">${brk('sup')}</div></div>
   <div class="card stat"><div class="k">حصص متبقية</div><div class="v">${A.left}</div><div class="k">${brk('left')}</div></div>`;
}
function renderTabs(){
  $('#tabs').innerHTML = Y().subjects.map(s=>`<button class="tab" role="tab" data-tab="${s.id}" aria-selected="${s.id===subj}">${s.name}<span class="pct">${countSessions(subjSessions(s)).pct}٪</span></button>`).join('');
}
function renderFilters(){
  const st=countSessions(subjSessions(S()));
  const F=[['all','الكل',st.total],['left','لم تُنجز',st.left],['sup','يحتاج إلى دعم',st.sup],['ok','تم الاستيعاب',st.ok]];
  $('#filters').innerHTML = F.map(([k,l,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${k===filter}">${l}<span class="n">${n}</span></button>`).join('');
}
const secId=P=>`${year}-${subj}-${P.n}`;
function renderPeriodNav(){
  $('#periodNav').innerHTML = S().periods.map((P,i)=>{ const st=countSessions(P.sessions);
    return `<button class="pjump ${st.left===0?'done':''}" style="--pc:${PCOLORS[i%PCOLORS.length]}" data-jump="${secId(P)}"><b>${P.title}</b><small>${st.ok+st.sup}/${st.total}</small>${barHTML(st)}</button>`}).join('');
}
function passes(st){ if(filter==='all')return true; if(filter==='left')return !st; return st===filter; }
function periodHeadInner(P){
  const st=countSessions(P.sessions);
  return `<h2>${P.title}<small>${S().name} · ${Y().name}</small></h2>
    ${st.left===0?'<span class="badge-done">مكتملة</span>':''}
    <div class="p-prog">${barHTML(st)}<div class="p-count"><span>${st.ok+st.sup} من ${st.total} حصة (${st.pct}٪)</span><span class="c-ok">✓ ${st.ok} تم الاستيعاب</span><span class="c-sup">! ${st.sup} يحتاج إلى دعم</span></div></div>${ICON_CHEV}`;
}

/* rowspans: activity > competency > distinctive_goals (only when goals column sits before the day, as in the book) */
function computeSpans(list, cols, merge){
  const mergeable=['activity','competency']; const di=cols.indexOf('distinctive_goals'), dy=cols.indexOf('day');
  if(di>-1 && di<dy) mergeable.push('distinctive_goals');
  const spans={}; for(const c of mergeable) spans[c]=new Array(list.length).fill(merge?0:1);
  if(!merge) return {spans,mergeable};
  let bounds=[[0,list.length]];
  for(const c of mergeable){
    const nb=[];
    for(const [a,b] of bounds){ for(let i=a;i<b;){ let j=i+1; while(j<b && norm(list[j][c])===norm(list[i][c])) j++; spans[c][i]=j-i; nb.push([i,j]); i=j; } }
    bounds=nb;
  }
  return {spans,mergeable};
}
const CLS={activity:'act',competency:'comp',day:'day',distinctive_goals:'goal',contents:'cont',session_goals:'sess'};
function rowHTML(s,cols,spans,mergeable,i,actIdx,multiAct){
  const rec=state.status[s.key], st=rec?.s;
  let h=`<tr class="s-row ${st==='ok'?'is-ok':st==='sup'?'is-sup':''}" data-key="${esc(s.key)}">`;
  for(const c of cols){
    if(mergeable.includes(c)){ const n=spans[c][i]; if(!n) continue;
      const cls = c==='activity'?`act a${actIdx}`: c==='competency'?'comp':'dg';
      h+=`<td class="${cls}${n>1?' merged':''}" ${c!=='activity'?`data-l="${COLS[c]}"`:''} rowspan="${n}">${cellHTML(s[c])}</td>`; continue; }
    if(c==='day'){ h+=`<td class="day" data-l="اليوم">${esc(s.day)}${multiAct?`<span class="actchip">${esc(s.activity)}</span>`:''}</td>`; continue; }
    h+=`<td class="${CLS[c]}" data-l="${COLS[c]}">${cellHTML(s[c])}</td>`;
  }
  h+=`<td class="st"><div class="stbtns">
      <button class="sbtn ok" data-set="ok" aria-pressed="${st==='ok'}"><span class="box">${ICON_CHECK}</span>تم الاستيعاب</button>
      <button class="sbtn sup" data-set="sup" aria-pressed="${st==='sup'}"><span class="box">${ICON_FLAG}</span>يحتاج إلى دعم</button>
    </div>${rec?.d?`<div class="stamp">${fmtDate(rec.d)}</div>`:''}</td></tr>`;
  return h;
}
function tableHTML(P){
  const Sb=S(), cols=Sb.columns;
  const list=P.sessions.filter(s=>passes(state.status[s.key]?.s));
  if(!list.length) return `<div class="tbl-wrap"><div class="empty">لا توجد حصص في هذا التصنيف.</div></div>`;
  const merge = filter==='all' && !isMobile();
  const {spans,mergeable}=computeSpans(list,cols,merge);
  const acts=[...new Set(P.sessions.map(s=>s.activity))], multi=acts.length>1;
  const head = cols.map(c=> c==='activity' && Sb.id==='arabic' ? 'الأنشطة' : COLS[c]);
  const rows=list.map((s,i)=>rowHTML(s,cols,spans,mergeable,i,acts.indexOf(s.activity),multi)).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}<th>الحالة</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function evalHTML(P){
  const e=P.evaluation; if(!e) return '';
  return `<div class="eval"><div class="sec-label">التقييم</div><div class="tbl-wrap"><table><thead><tr><th>${S().id==='arabic'?'الأنشطة':'النشاط'}</th><th>الأداء المنتظر</th><th>ورقة التقييم</th></tr></thead>
   <tbody><tr data-eval="${P.evalKey}"><td class="act a0">${esc(e.activity||S().act)}</td><td class="perf" data-l="الأداء المنتظر">${esc(e.expected_performance)}</td>
   <td class="att"><button class="attach-btn" data-attach="${P.evalKey}">${ICON_CLIP}إرفاق التقييم</button><ul class="files" data-files="${P.evalKey}"></ul></td></tr></tbody></table></div></div>`;
}
async function renderFiles(ek){
  const ul=document.querySelector(`[data-files="${ek}"]`); if(!ul) return;
  const files=await filesFor(ek); files.sort((a,b)=>a.added.localeCompare(b.added));
  ul.innerHTML = files.map(f=>`<li><a href="#" data-open="${f.id}" title="${esc(f.name)}">${esc(f.name)}</a><span class="sz">${fmtSize(f.size)}</span><button class="x" data-del="${f.id}" aria-label="حذف">${ICON_X}</button></li>`).join('');
  ul.closest('tr').classList.toggle('has-file', files.length>0);
}
function renderContent(){
  const Sb=S();
  $('#content').className = `wrap subj-${Sb.id}`;
  $('#content').innerHTML = Sb.periods.map((P,i)=>{
    const id=secId(P), col=!!state.ui.collapsed[id];
    return `<section class="period ${col?'collapsed':''}" id="${id}" style="--pc:${PCOLORS[i%PCOLORS.length]}">
      <div class="p-head" data-toggle="${id}" role="button" aria-expanded="${!col}">${periodHeadInner(P)}</div>
      <div class="p-body"><div class="sec-label">التعلّم المنهجي</div>${tableHTML(P)}${evalHTML(P)}</div></section>`;
  }).join('');
  Sb.periods.forEach(P=>renderFiles(P.evalKey));
}
function renderAll(){ renderYears(); renderSummary(); renderTabs(); renderFilters(); renderPeriodNav(); renderContent(); }
function refreshCounts(P){
  renderYears(); renderSummary(); renderTabs(); renderFilters(); renderPeriodNav();
  const head=document.querySelector(`[data-toggle="${secId(P)}"]`); if(head) head.innerHTML=periodHeadInner(P);
}
function saveUI(){ state.ui.year=year; state.ui.tabs[year]=subj; state.ui.filter=filter; save(); }

/* ---------- events ---------- */
document.addEventListener('click', async e=>{
  const t=e.target.closest('button,[data-toggle],a[data-open]'); if(!t) return;
  if(t.dataset.year){ year=t.dataset.year; subj = state.ui.tabs[year] && subjOf(year,state.ui.tabs[year]) ? state.ui.tabs[year] : Y().subjects[0].id; saveUI(); renderAll(); return; }
  if(t.dataset.tab){ subj=t.dataset.tab; saveUI(); renderAll(); window.scrollTo({top:0}); return; }
  if(t.dataset.filter){ filter=t.dataset.filter; saveUI(); renderFilters(); renderContent(); return; }
  if(t.dataset.jump){ const sec=document.getElementById(t.dataset.jump); if(sec){ if(sec.classList.contains('collapsed')){ state.ui.collapsed[t.dataset.jump]=false; save(); sec.classList.remove('collapsed'); } sec.scrollIntoView({behavior:'smooth'}); } return; }
  if(t.dataset.toggle){ const id=t.dataset.toggle, sec=document.getElementById(id); const c=!sec.classList.contains('collapsed'); sec.classList.toggle('collapsed',c); t.setAttribute('aria-expanded',!c); state.ui.collapsed[id]=c; save(); return; }
  if(t.dataset.set){
    const tr=t.closest('tr'), k=tr.dataset.key, cur=state.status[k]?.s;
    if(cur===t.dataset.set) delete state.status[k]; else state.status[k]={s:t.dataset.set,d:new Date().toISOString()};
    save();
    const P=S().periods.find(p=>p.sessions.some(x=>x.key===k));
    if(filter!=='all'){ renderContent(); refreshCounts(P); return; }
    const st=state.status[k]?.s;
    tr.classList.toggle('is-ok',st==='ok'); tr.classList.toggle('is-sup',st==='sup');
    tr.querySelectorAll('.sbtn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===st));
    const tdSt=tr.querySelector('td.st'); tdSt.querySelector('.stamp')?.remove();
    if(state.status[k]) tdSt.insertAdjacentHTML('beforeend',`<div class="stamp">${fmtDate(state.status[k].d)}</div>`);
    refreshCounts(P); return;
  }
  if(t.dataset.attach){ const inp=$('#attachInput'); inp.dataset.target=t.dataset.attach; inp.value=''; inp.click(); return; }
  if(t.dataset.del){ if(!confirm('حذف هذا المرفق؟')) return; const ek=t.closest('[data-files]').dataset.files; await delFile(t.dataset.del); renderFiles(ek); toast('تم حذف المرفق'); return; }
  if(t.dataset.open){ e.preventDefault(); const f=(await allFiles()).find(x=>x.id===t.dataset.open); if(f){ const url=URL.createObjectURL(f.blob); const w=window.open(url,'_blank'); if(!w){ const a=document.createElement('a'); a.href=url; a.download=f.name; a.click(); } setTimeout(()=>URL.revokeObjectURL(url),60000);} return; }
  if(t.id==='printBtn'){ window.print(); return; }
  if(t.id==='exportBtn'){ exportBackup(); return; }
  if(t.id==='importBtn'){ $('#importFile').click(); return; }
});
$('#attachInput').addEventListener('change', async e=>{
  const ek=e.target.dataset.target, files=[...e.target.files]; if(!files.length) return;
  try{
    for(const f of files){ await putFile({id:ek+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), evalKey:ek, name:f.name, type:f.type, size:f.size, added:new Date().toISOString(), blob:f}); }
    renderFiles(ek); toast(files.length>1?`تم إرفاق ${files.length} ملفات`:'تم إرفاق التقييم');
  }catch(err){ toast('تعذّر حفظ المرفق على هذا المتصفح'); }
});
const b64=blob=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
async function exportBackup(){
  const files=await allFiles(); const packed=[];
  for(const f of files) packed.push({...f, blob:undefined, data:await b64(f.blob)});
  const out={app:'TunisTracker',version:2,exported:new Date().toISOString(),status:state.status,files:packed};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
  a.download=`TunisTracker-${new Date().toISOString().slice(0,10)}.json`; a.click(); toast('تم تنزيل النسخة الاحتياطية');
}
$('#importFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(d.app!=='TunisTracker') throw 0;
    if(!confirm('سيتم استبدال التقدم الحالي بمحتوى النسخة الاحتياطية. متابعة؟')) return;
    state.status=d.status||{}; save();
    for(const x of (d.files||[])){ const blob=await (await fetch(x.data)).blob(); await putFile({id:x.id,evalKey:x.evalKey,name:x.name,type:x.type,size:x.size,added:x.added,blob}); }
    renderAll(); toast('تم استرجاع النسخة الاحتياطية');
  }catch(err){ toast('الملف غير صالح'); }
  e.target.value='';
});
let wasMobile=isMobile();
addEventListener('resize',()=>{ if(isMobile()!==wasMobile){ wasMobile=isMobile(); renderContent(); } });
renderAll();
</script>
